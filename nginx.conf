server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/css
		text/javascript
		application/javascript
		application/json
		application/manifest+json
		image/svg+xml
		image/x-icon
		font/woff2;

	# Vite emits content-hashed bundles under /assets/, safe to cache forever.
	location ^~ /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Entry document must always be revalidated so new deploys pick up new hashes.
	location = /index.html {
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# TanStack Router is client-side: unknown paths are routes, not 404s.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
